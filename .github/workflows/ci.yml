name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # package.json declares node >=20 and the bundle targets node20.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  checks:
    name: Typecheck, bundle and plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The Claude Code release whose plugin validator the manifests are checked against.
      CLAUDE_CODE_VERSION: 2.1.300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Users install the plugin straight from git, so the committed bundle is
      # what runs. It must be exactly what src/ builds to.
      - name: Committed bundle matches src/
        run: |
          npm run build
          if ! git diff --quiet -- plugins/decisionlayer/mcp/server.mjs; then
            echo "::error file=plugins/decisionlayer/mcp/server.mjs::The bundle is out of date. Run 'npm run build' and commit plugins/decisionlayer/mcp/server.mjs."
            git diff --stat -- plugins/decisionlayer/mcp/server.mjs
            exit 1
          fi
      - name: Validate the marketplace and plugin with Claude Code
        run: |
          npm exec --yes --package=@anthropic-ai/claude-code@"$CLAUDE_CODE_VERSION" -- claude plugin validate --strict .
          npm exec --yes --package=@anthropic-ai/claude-code@"$CLAUDE_CODE_VERSION" -- claude plugin validate --strict plugins/decisionlayer
